<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Recompensas</title>
  <link rel="stylesheet" href="Pontuacao.css" />
</head>
<body>
    <script src="main.js"></script>
  <header>
    <h1>Pontos e Ofertas</h1>
    <div class="pontos">
      <span>Pontos:</span>
      <strong id="pontos-atuais">0</strong>
    </div>
  </header>

  <main>
    <h2>Troca os teus pontos</h2>
    <div class="produtos">
      <div class="produto">
        <img src="sasum.jpeg" alt="Produto 1">
        <h3>10 Senhas Cantina UMINHO</h3>
        <p>100 pontos</p>
        <button>Trocar</button>
      </div>
  
      <div class="produto">
        <img src="autocarro.jpeg" alt="Produto 2">
        <h3>10 viagens dos Autocarros da AAUMINHO</h3>
        <p>200 pontos</p>
        <button>Trocar</button>
      </div>
  
      <div class="produto">
        <img src="enterro.png" alt="Produto 3">
        <h3>Pulseira Enterro da Gata'25</h3>
        <p>500 pontos</p>
        <button>Trocar</button>
      </div>
    </div>
  </main>
  
  <!-- A div que mostrará a mensagem de recompensa adquirida -->
  <div id="recompensaMensagem" class="recompensa-mensagem">
    Recompensa adquirida! Verifica no portal académico.
  </div>
  
  <script src="Pontuacao.js"></script>
  <script src="main.js"></script>


</body>




</html>

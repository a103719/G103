
<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=390, height=844, user-scalable=no"/>
  <title>Histórico de Ocorrências</title>
  <link href="css/registo.css" rel="stylesheet"/>
  <link href="css/historico.css" rel="stylesheet"/>
  <link href="css/inicial.css" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet"/>
  <style>
    .estado {
      display: flex;
      align-items: center;
      font-weight: 600;
      font-size: 14px;
      margin-top: 8px;
    }
    .bolinha {
      display: inline-block;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      margin-right: 8px;
    }
    .pendente { background-color: red; }
    .analise { background-color: gold; }
    .resolvida { background-color: limegreen; }
  </style>
</head>
<body style="margin: 0; padding: 0; overflow: hidden; height: 100vh; width: 100vw; position: relative;">
  <div class="bg-circle1"></div>
  <div class="bg-circle2"></div>

  <div class="app-container">
    <button class="btn-back" onclick="history.back()">
      <img src="https://img.icons8.com/ios-filled/24/ffffff/chevron-left.png" alt="Voltar"/>
    </button>

    <h1>Histórico de Ocorrências</h1>
    <div id="lista-ocorrencias"></div>
  </div>

  <!-- Navegação inferior -->
  <div class="bottom-nav">
    <a class="nav-item" href="inicial.html">
      <img src="https://img.icons8.com/fluency-systems-filled/24/0A77BC/home.png" alt="Início"/>
      <span>Início</span>
    </a>
    <a class="nav-item" href="registo.html">
      <img src="https://img.icons8.com/fluency-systems-filled/24/0A77BC/plus-math.png" alt="Registar"/>
      <span>Registar</span>
    </a>
    <a class="nav-item active" href="historico.html">
      <img src="https://img.icons8.com/fluency-systems-filled/24/0A77BC/time-machine.png" alt="Histórico"/>
      <span>Histórico</span>
    </a>
    <a class="nav-item" href="Pontuacao.html">
      <img src="https://img.icons8.com/fluency-systems-filled/24/0A77BC/star.png" alt="Pontos"/>
      <span>Pontos</span>
    </a>
  </div>
  

  <script>
    function getOcorrenciasReais() {
  const dados = localStorage.getItem("eyesEverywhere");
  return dados ? JSON.parse(dados).ocorrenciasLista || [] : [];
}
    document.addEventListener("DOMContentLoaded", () => {
      const utilizador = localStorage.getItem("idUtilizador") || "Manuel Silva";
  
      if (!localStorage.getItem("ocorrencias")) {
        localStorage.setItem("ocorrencias", JSON.stringify([
          {
            idUtilizador: utilizador,
            tipo: "Mal Estacionado",
            localizacao: "Parque Azurém",
            titulo: "Carro mal estacionado",
            descricao: "Ocupou duas vagas perto da entrada.",
            estado: "pendente",
            data: "2024-04-12 14:20"
          },
          {
            idUtilizador: utilizador,
            tipo: "Ocupação Indevida",
            localizacao: "Setor B",
            titulo: "Lugar reservado ocupado",
            descricao: "Carro sem dístico em vaga de deficiente.",
            estado: "análise",
            data: "2024-04-11 10:05"
          },
          {
            idUtilizador: utilizador,
            tipo: "Outro",
            localizacao: "Entrada principal",
            titulo: "Buraco no pavimento",
            descricao: "Existe um buraco que representa perigo.",
            estado: "resolvida",
            data: "2024-04-08 09:00"
          }
        ]));
      }
  
      const ocorrencias = getOcorrenciasReais();
      const minhas = ocorrencias.filter(o => o.utilizador === utilizador);

      const container = document.getElementById("lista-ocorrencias");
  
      function mostrar(ocorrenciasParaMostrar, titulo = "Histórico de Ocorrências") {
        container.innerHTML = ""; // limpar
  
        if (ocorrenciasParaMostrar.length === 0) {
          container.innerHTML = "<p style='text-align:center;'>Sem ocorrências registadas.</p>";
          return;
        }
  
        const h1 = document.querySelector("h1");
        h1.textContent = titulo;
  
        // Adicionar botão de voltar se for um filtro
        if (titulo !== "Histórico de Ocorrências") {
          const btnVoltar = document.createElement("button");
          btnVoltar.textContent = "← Ver todas";
          btnVoltar.className = "btn-voltar";
          btnVoltar.onclick = () => location.reload(); // recarrega a página
          container.appendChild(btnVoltar);
        }
  
        ocorrenciasParaMostrar.forEach(o => {
          const estadoClasse = o.estado === "pendente" ? "pendente"
                              : o.estado === "análise" ? "analise"
                              : "resolvida";
  
          const div = document.createElement("div");
          div.className = "input-wrapper";
          div.innerHTML = `
            <div style="background-color: #eceeff; border-radius: 12px; padding: 12px;">
              <strong>${o.titulo}</strong><br/>
              📌 Tipo: ${o.tipo}<br/>
              📍 ${o.localizacao}<br/>
              📅 ${o.data}<br/>
              <p style="margin-top: 6px;">📝 ${o.descricao}</p>
              <div class="estado">
                <span class="bolinha ${estadoClasse}"></span> ${o.estado.charAt(0).toUpperCase() + o.estado.slice(1)}
                <img src="https://img.icons8.com/ios-glyphs/20/000000/search--v1.png" alt="lupa" style="margin-left:8px; cursor:pointer;"
                     onclick="filtrarPorEstado('${o.estado}')" title="Filtrar por ${o.estado}" />
              </div>
            </div>
          `;
          container.appendChild(div);
        });
      }
  
      // tornar função acessível globalmente
      window.filtrarPorEstado = (estadoAlvo) => {
        const filtradas = minhas.filter(o => o.estado === estadoAlvo);
        let tituloFormatado = estadoAlvo === "pendente" ? "Pendentes"
                    : estadoAlvo === "análise" ? "Em análise"
                    : "Resolvidas";
mostrar(filtradas, tituloFormatado);
      };
  
      mostrar(minhas); // mostrar todas inicialmente
    });
  </script>
</body>
</html>
